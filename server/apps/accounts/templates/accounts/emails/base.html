<!-- accounts/templates/accounts/emails/base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Base styles */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #eeeeee;
        }

        .header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666666;
            font-size: 14px;
        }

        .content {
            padding: 40px 30px;
        }

        .button {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            margin: 20px 0;
        }

        .footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 13px;
            color: #999999;
            background-color: #fafafa;
            border-top: 1px solid #eeeeee;
        }

        .footer-links {
            margin-top: 10px;
        }

        .footer-links a {
            color: #2563eb;
            text-decoration: none;
            margin: 0 8px;
        }

        .divider {
            height: 1px;
            background-color: #eeeeee;
            margin: 25px 0;
        }

        .info-box {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }

        .info-box h4 {
            margin-top: 0;
            color: #374151;
        }

        .info-box ul {
            margin-bottom: 0;
            padding-left: 20px;
            color: #4b5563;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .email-container {
                margin: 0;
                width: 100%;
            }
            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <div class="logo">{{ site_name }}</div>
            <div class="subtitle">{{ email_subtitle }}</div>
        </div>

        <div class="content">
            {% block content %}{% endblock %}
        </div>

        <div class="footer">
            <p>© {% now "Y" %} {{ site_name }}. All rights reserved.</p>
            <div class="footer-links">
                <a href="{{ site_url }}">Website</a>
                <a href="{{ site_url }}/privacy">Privacy</a>
                <a href="{{ site_url }}/terms">Terms</a>
            </div>
            <p style="margin-top: 15px; font-size: 11px;">
                Sent to {{ user_email }}. If this wasn't you, please ignore this email.
            </p>
        </div>
    </div>
</body>

</html>
